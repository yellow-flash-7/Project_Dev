<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Welcome to CertiTrust, an academic certificate authenticity platform.">
  <meta name="theme-color" content="#07152e">
  <title>Welcome | CertiTrust</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body.welcome-page{min-height:100vh;background:#07152e;color:#fff;overflow:hidden}
    .welcome-shell{min-height:100vh;position:relative;display:grid;place-items:center;padding:28px;isolation:isolate}
    .welcome-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
    .welcome-overlay{position:absolute;inset:0;background:linear-gradient(110deg,rgba(4,13,31,.88),rgba(7,21,46,.48) 55%,rgba(4,13,31,.82));z-index:-1}
    .welcome-content{width:min(900px,100%);text-align:center;padding:30px 20px}
    .welcome-mark{width:62px;height:62px;display:grid;place-items:center;margin:0 auto 22px;border:1px solid rgba(255,255,255,.28);border-radius:19px;background:rgba(255,255,255,.12);font-size:32px;font-weight:900;box-shadow:0 12px 50px rgba(0,0,0,.2)}
    .welcome-kicker{font-size:12px;letter-spacing:.22em;font-weight:800;color:#a9c4ff}
    .welcome-content h1{font-size:clamp(48px,9vw,92px);line-height:.98;letter-spacing:-.055em;margin:18px 0}
    .welcome-content h1 span{color:#8eb0ff}
    .welcome-copy{max-width:650px;margin:0 auto;color:#d5def2;font-size:clamp(16px,2vw,20px)}
    .welcome-actions{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;margin-top:34px}
    .welcome-start{padding:15px 28px;border-radius:14px;background:#fff;color:#10254c;font-size:16px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
    .welcome-start:hover{background:#e8efff;color:#10254c;transform:translateY(-2px)}
    .welcome-foot{position:absolute;bottom:22px;left:20px;right:20px;text-align:center;color:rgba(255,255,255,.65);font-size:12px;letter-spacing:.08em}
    .welcome-foot a{color:#fff;text-decoration:underline;text-underline-offset:3px}
    @media(prefers-reduced-motion:reduce){.welcome-video{display:none}}
  </style>
</head>
<body class="welcome-page">
  <main class="welcome-shell">
    <video class="welcome-video" autoplay muted loop playsinline poster="/media/intro-poster.svg" aria-label="CertiTrust animated introduction">
      <source src="/media/intro.mp4" type="video/mp4">
    </video>
    <div class="welcome-overlay" aria-hidden="true"></div>
    <section class="welcome-content">
      <div class="welcome-mark" aria-hidden="true">✓</div>
      <div class="welcome-kicker">ACADEMIC TRUST • DIGITAL AUTHENTICITY</div>
      <h1>Welcome to <span>CertiTrust</span></h1>
      <p class="welcome-copy">A trusted way to issue, protect and verify academic certificates using secure records, SHA-256 document fingerprints and QR verification.</p>
      <div class="welcome-actions">
        <a class="btn welcome-start" href="/home.html">Start CertiTrust <span aria-hidden="true">→</span></a>
      </div>
    </section>
    <div class="welcome-foot">ISSUE • PROTECT • VERIFY &nbsp; | &nbsp; <a href="/home.html">Skip introduction</a></div>
  </main>
  <script>
    // QR links should go straight to the verification page, not stop at the intro.
    const params = new URLSearchParams(location.search);
    if (params.has('verify')) location.replace('/home.html' + location.search + location.hash);
  </script>
</body>
</html>
